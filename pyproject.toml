[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imp-metabolic"
dynamic = ["version"]
description = "Metabolic networks of microbial communities and MAGs from IMP3 annotations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "networkx>=3.0", "pyarrow>=14"]

[project.optional-dependencies]
fast = ["duckdb>=1.0"]
extra-sources = ["pyreadr>=0.5", "rdkit>=2024.3"]
test = ["pytest"]

[project.scripts]
imp-metabolic = "impmetabolic.cli:main"

[tool.setuptools.dynamic]
version = {attr = "impmetabolic.__version__"}

[tool.setuptools.packages.find]
include = ["impmetabolic*"]

[tool.setuptools.package-data]
impmetabolic = ["data/*.tsv"]
